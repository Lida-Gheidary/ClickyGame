<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How many rockets can you shoot in 60 seconds?!</title>
  <meta name="description" content="Shoot the rockets, race the clock, and join the Rocket Clicker leaderboard.">
  <meta name="theme-color" content="#060d18">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="css/fonts/Orbitron.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <h1 id="gameTitle">How many rockets<br class="desktop-break"> can you shoot<br class="desktop-break"> in <span class="keep-together">60 seconds?!</span></h1>
      <button id="button3" class="button button-outline leaderboard-trigger" type="button" aria-haspopup="dialog" aria-controls="leaderboardDialog">
        <svg class="trophy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v5c0 4-2 6-4 6s-4-2-4-6V3Zm0 2H4v2c0 3 2 5 5 5m7-7h4v2c0 3-2 5-5 5M12 14v5m-4 2h8m-6-2h4"/></svg>
        <span class="leaderboard-label">Leaderboard</span>
      </button>
    </header>

    <section class="game-panel" aria-label="Rocket game">
      <div id="hud" class="hud">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="scoreDisplay" class="stat-value score-value" aria-label="Score: 0">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time left</span>
          <span id="timerDisplay" class="stat-value timer-value" aria-label="60 seconds remaining">60<span class="time-unit">s</span></span>
        </div>
      </div>

      <div class="arena-shell">
        <div id="gameArea" class="game-area" aria-label="Click or tap a rocket to score a point"></div>

        <section id="startSection" class="arena-overlay">
          <div class="state-card">
            <img class="state-rocket" src="img/rocket-target.svg" width="72" height="72" alt="">
            <h2>Ready for launch?</h2>
            <p>Click or tap the rockets.<br>One rocket. One point. 60 seconds.</p>
            <button id="button1" class="button button-primary" type="button">Start game</button>
          </div>
        </section>

        <section id="endSection" class="arena-overlay" hidden aria-labelledby="resultTitle">
          <div class="state-card result-card">
            <h2 id="resultTitle">Time's up!</h2>
            <p class="result-label">Your score</p>
            <p id="finalScore" class="final-score">0</p>
            <form id="scoreForm" class="score-form" novalidate>
              <label id="label1" for="name">Your name on the leaderboard</label>
              <input id="name" name="name" type="text" minlength="3" maxlength="16" placeholder="Enter your name" autocomplete="nickname" aria-describedby="formMessage" required>
              <button id="button2" class="button button-primary" type="submit">Submit score</button>
            </form>
            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
            <button id="playAgain" class="button button-outline" type="button">Play again</button>
          </div>
        </section>
      </div>
    </section>
    <p id="gameStatus" class="game-status" role="status" aria-live="polite">60 seconds. How high can you score?</p>
  </main>

  <dialog id="leaderboardDialog" class="leaderboard-dialog" aria-labelledby="leaderboardTitle" aria-describedby="leaderboardMessage">
    <div class="dialog-header">
      <h2 id="leaderboardTitle">Top 20 scores</h2>
      <button id="closeLeaderboard" class="close-button" type="button" aria-label="Close leaderboard" autofocus>&times;</button>
    </div>
    <p id="leaderboardMessage" class="leaderboard-message" role="status" aria-live="polite">Loading leaderboard…</p>
    <div class="score-table-scroll">
      <table class="score-table" aria-label="Top 20 scores">
        <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
        <tbody id="scoreboard"></tbody>
      </table>
    </div>
    <div class="leaderboard-actions">
      <button id="modalPlayAgain" class="button button-primary" type="button">Play again</button>
      <button id="refreshLeaderboard" class="button button-outline" type="button">Refresh</button>
    </div>
  </dialog>
  <noscript>This game needs JavaScript to run. Please enable it in your browser.</noscript>
  <script src="js/app.js"></script>
</body>
</html>
